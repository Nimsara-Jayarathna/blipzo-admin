name: Deploy blipzo-admin

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'angular.json'
      - '.nvmrc'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-admin.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'angular.json'
      - '.nvmrc'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blipzo-admin-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_NETWORK: npm_default

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

  build_image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          REPO_SLUG="${{ github.repository }}"
          SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/$(printf '%s' "$REPO_SLUG" | tr '[:upper:]' '[:lower:]')"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            ENV_TAG="prod"
            BUILD_CFG="production"
            ADMIN_API_BASE_URL="${{ secrets.ADMIN_API_BASE_URL_PROD }}"
            ADMIN_API_PREFIX="${{ secrets.ADMIN_API_PREFIX_PROD }}"
            ADMIN_API_VERSION="${{ secrets.ADMIN_API_VERSION_PROD }}"
            ADMIN_API_SEGMENT="${{ secrets.ADMIN_API_SEGMENT_PROD }}"
          else
            ENV_TAG="stg"
            BUILD_CFG="development"
            ADMIN_API_BASE_URL="${{ secrets.ADMIN_API_BASE_URL_STG }}"
            ADMIN_API_PREFIX="${{ secrets.ADMIN_API_PREFIX_STG }}"
            ADMIN_API_VERSION="${{ secrets.ADMIN_API_VERSION_STG }}"
            ADMIN_API_SEGMENT="${{ secrets.ADMIN_API_SEGMENT_STG }}"
          fi

          ADMIN_API_PREFIX="${ADMIN_API_PREFIX:-api}"
          ADMIN_API_VERSION="${ADMIN_API_VERSION:-v1.1}"
          ADMIN_API_SEGMENT="${ADMIN_API_SEGMENT:-admin}"

          echo "::add-mask::$ADMIN_API_BASE_URL"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "ENV_TAG=$ENV_TAG" >> "$GITHUB_ENV"
          echo "BUILD_CFG=$BUILD_CFG" >> "$GITHUB_ENV"
          echo "ADMIN_API_BASE_URL=$ADMIN_API_BASE_URL" >> "$GITHUB_ENV"
          echo "ADMIN_API_PREFIX=$ADMIN_API_PREFIX" >> "$GITHUB_ENV"
          echo "ADMIN_API_VERSION=$ADMIN_API_VERSION" >> "$GITHUB_ENV"
          echo "ADMIN_API_SEGMENT=$ADMIN_API_SEGMENT" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            BUILD_CONFIGURATION=${{ env.BUILD_CFG }}
            ADMIN_API_BASE_URL=${{ env.ADMIN_API_BASE_URL }}
            ADMIN_API_PREFIX=${{ env.ADMIN_API_PREFIX }}
            ADMIN_API_VERSION=${{ env.ADMIN_API_VERSION }}
            ADMIN_API_SEGMENT=${{ env.ADMIN_API_SEGMENT }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:${{ env.ENV_TAG }}
            ${{ env.IMAGE }}:latest-${{ env.ENV_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build_image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOCKER_NETWORK: ${{ secrets.NPM_NET_NAME || 'npm_default' }}

    steps:
      - name: Compute deploy variables
        shell: bash
        run: |
          set -euo pipefail

          REPO_SLUG="${{ github.repository }}"
          if [ -z "${REPO_SLUG:-}" ]; then
            echo "github.repository is empty; cannot compute GHCR image name." >&2
            exit 1
          fi

          SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/$(printf '%s' "$REPO_SLUG" | tr '[:upper:]' '[:lower:]')"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            CONTAINER_NAME="blipzo-admin-prod"
          else
            CONTAINER_NAME="blipzo-admin-stg"
          fi

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=$CONTAINER_NAME" >> "$GITHUB_ENV"

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_PORT"
          echo "::add-mask::$SSH_USER"
          echo "::add-mask::$SSH_PRIVATE_KEY"

          if [ -z "${SSH_PORT:-}" ] || ! echo "$SSH_PORT" | grep -Eq '^[0-9]+$'; then
            echo "Invalid SSH_PORT" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_OPTS=-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Deploy (candidate -> health check -> final)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${IMAGE:-}" ] || [ -z "${SHA:-}" ]; then
            echo "Missing IMAGE or SHA for deploy." >&2
            echo "IMAGE set? $( [ -n "${IMAGE:-}" ] && echo yes || echo no )" >&2
            echo "SHA set? $( [ -n "${SHA:-}" ] && echo yes || echo no )" >&2
            exit 1
          fi
          if ! echo "$SHA" | grep -Eq '^[0-9a-f]{6,40}$'; then
            echo "Invalid SHA format (expected hex): $SHA" >&2
            exit 1
          fi
          if ! echo "$IMAGE" | grep -Eq '^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$'; then
            echo "Invalid IMAGE format: $IMAGE" >&2
            exit 1
          fi
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "NPM_NET_NAME='${DOCKER_NETWORK}' CONTAINER_NAME='${CONTAINER_NAME}' IMAGE='${IMAGE}' SHA='${SHA}' bash -s" <<'EOF'
          set -euo pipefail

          if ! docker network inspect "$NPM_NET_NAME" >/dev/null 2>&1; then
            docker network create --driver bridge "$NPM_NET_NAME"
          fi

          # Cleanup any leftover candidate containers from previous runs.
          docker ps -aq --filter "name=${CONTAINER_NAME}-cand-" | xargs -r docker rm -f >/dev/null 2>&1 || true

          docker pull "${IMAGE}:${SHA}"

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker run -d --name "$CONTAINER_NAME" \
            --network "$NPM_NET_NAME" \
            --network-alias "$CONTAINER_NAME" \
            --restart unless-stopped \
            --label commit_sha="$SHA" \
            "${IMAGE}:${SHA}"

          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || echo false)" != "true" ]; then
            echo "Final container is not running." >&2
            docker ps -a --filter "name=$CONTAINER_NAME" >&2 || true
            docker logs --tail=200 "$CONTAINER_NAME" >&2 || true
            exit 1
          fi

          # Health check (hybrid: port open -> http ok). Retry up to 30s.
          ok=false
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER_NAME" sh -lc "command -v nc >/dev/null 2>&1"; then
              if docker exec "$CONTAINER_NAME" sh -lc "nc -z 127.0.0.1 80" >/dev/null 2>&1; then
                if docker exec "$CONTAINER_NAME" sh -lc "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"; then
                  ok=true
                  break
                fi
              fi
            else
              if docker exec "$CONTAINER_NAME" sh -lc "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"; then
                ok=true
                break
              fi
            fi
            sleep 1
          done
          if [ "$ok" != "true" ]; then
            echo "Health check failed after timeout." >&2
            docker ps -a --filter "name=$CONTAINER_NAME" >&2 || true
            docker logs --tail=200 "$CONTAINER_NAME" >&2 || true
            exit 1
          fi

          docker image prune -f --filter "until=72h" >/dev/null 2>&1 || true
          EOF
