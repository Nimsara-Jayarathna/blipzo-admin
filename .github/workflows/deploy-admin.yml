name: Deploy blipzo-admin

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-admin.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: blipzo-admin-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_NETWORK: npm_default

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.vars.outputs.deploy_env }}
      image: ${{ steps.vars.outputs.image }}
      image_tag_env: ${{ steps.vars.outputs.image_tag_env }}
      image_tag_sha: ${{ steps.vars.outputs.image_tag_sha }}
      build_cfg: ${{ steps.vars.outputs.build_cfg }}
      container_name: ${{ steps.vars.outputs.container_name }}
      docker_network: ${{ steps.vars.outputs.docker_network }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Set build/deploy variables
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short HEAD)"
          REPO_SLUG="${GITHUB_REPOSITORY:-${{ github.repository }}}"
          if [ -z "${REPO_SLUG:-}" ]; then
            echo "GITHUB_REPOSITORY is empty; cannot compute GHCR image name." >&2
            exit 1
          fi
          IMAGE="ghcr.io/$(printf '%s' "$REPO_SLUG" | tr '[:upper:]' '[:lower:]')"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            DEPLOY_ENV="production"
            IMAGE_TAG_ENV="prod"
            BUILD_CFG="production"
            CONTAINER_NAME="blipzo-admin-prod"
            ADMIN_API_BASE_URL="${{ secrets.ADMIN_API_BASE_URL_PROD }}"
            ADMIN_API_PREFIX="${{ secrets.ADMIN_API_PREFIX_PROD }}"
            ADMIN_API_VERSION="${{ secrets.ADMIN_API_VERSION_PROD }}"
            ADMIN_API_SEGMENT="${{ secrets.ADMIN_API_SEGMENT_PROD }}"
          else
            DEPLOY_ENV="staging"
            IMAGE_TAG_ENV="stg"
            BUILD_CFG="development"
            CONTAINER_NAME="blipzo-admin-stg"
            ADMIN_API_BASE_URL="${{ secrets.ADMIN_API_BASE_URL_STG }}"
            ADMIN_API_PREFIX="${{ secrets.ADMIN_API_PREFIX_STG }}"
            ADMIN_API_VERSION="${{ secrets.ADMIN_API_VERSION_STG }}"
            ADMIN_API_SEGMENT="${{ secrets.ADMIN_API_SEGMENT_STG }}"
          fi

          ADMIN_API_PREFIX="${ADMIN_API_PREFIX:-api}"
          ADMIN_API_VERSION="${ADMIN_API_VERSION:-v1.1}"
          ADMIN_API_SEGMENT="${ADMIN_API_SEGMENT:-admin}"

          DOCKER_NETWORK_FROM_SECRET="${{ secrets.NPM_NET_NAME }}"
          DOCKER_NETWORK_EFFECTIVE="${DOCKER_NETWORK_FROM_SECRET:-${DOCKER_NETWORK}}"

          echo "::add-mask::$ADMIN_API_BASE_URL"
          echo "::add-mask::$ADMIN_API_PREFIX"
          echo "::add-mask::$ADMIN_API_VERSION"
          echo "::add-mask::$ADMIN_API_SEGMENT"

          echo "deploy_env=${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag_env=${IMAGE_TAG_ENV}" >> "$GITHUB_OUTPUT"
          echo "image_tag_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_cfg=${BUILD_CFG}" >> "$GITHUB_OUTPUT"
          echo "container_name=${CONTAINER_NAME}" >> "$GITHUB_OUTPUT"
          echo "docker_network=${DOCKER_NETWORK_EFFECTIVE}" >> "$GITHUB_OUTPUT"

          {
            echo "ADMIN_API_BASE_URL<<__EOF__"
            printf '%s\n' "$ADMIN_API_BASE_URL"
            echo "__EOF__"
            echo "ADMIN_API_PREFIX<<__EOF__"
            printf '%s\n' "$ADMIN_API_PREFIX"
            echo "__EOF__"
            echo "ADMIN_API_VERSION<<__EOF__"
            printf '%s\n' "$ADMIN_API_VERSION"
            echo "__EOF__"
            echo "ADMIN_API_SEGMENT<<__EOF__"
            printf '%s\n' "$ADMIN_API_SEGMENT"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on push events)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            BUILD_CONFIGURATION=${{ steps.vars.outputs.build_cfg }}
            ADMIN_API_BASE_URL=${{ env.ADMIN_API_BASE_URL }}
            ADMIN_API_PREFIX=${{ env.ADMIN_API_PREFIX }}
            ADMIN_API_VERSION=${{ env.ADMIN_API_VERSION }}
            ADMIN_API_SEGMENT=${{ env.ADMIN_API_SEGMENT }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.image_tag_sha }}
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.image_tag_env }}
            ${{ steps.vars.outputs.image }}:latest-${{ steps.vars.outputs.image_tag_env }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DOCKER_NETWORK: ${{ secrets.NPM_NET_NAME || 'npm_default' }}

    steps:
      - name: Compute deploy variables
        shell: bash
        run: |
          set -euo pipefail

          REPO_SLUG="${{ github.repository }}"
          if [ -z "${REPO_SLUG:-}" ]; then
            echo "github.repository is empty; cannot compute GHCR image name." >&2
            exit 1
          fi

          SHA="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/$(printf '%s' "$REPO_SLUG" | tr '[:upper:]' '[:lower:]')"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            CONTAINER_NAME="blipzo-admin-prod"
          else
            CONTAINER_NAME="blipzo-admin-stg"
          fi

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=$CONTAINER_NAME" >> "$GITHUB_ENV"

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::$SSH_HOST"
          echo "::add-mask::$SSH_PORT"
          echo "::add-mask::$SSH_USER"
          echo "::add-mask::$SSH_PRIVATE_KEY"

          if [ -z "${SSH_PORT:-}" ] || ! echo "$SSH_PORT" | grep -Eq '^[0-9]+$'; then
            echo "Invalid SSH_PORT" >&2
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          echo "SSH_OPTS=-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Deploy (candidate -> health check -> final)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${IMAGE:-}" ] || [ -z "${SHA:-}" ]; then
            echo "Missing IMAGE or SHA for deploy." >&2
            echo "IMAGE set? $( [ -n "${IMAGE:-}" ] && echo yes || echo no )" >&2
            echo "SHA set? $( [ -n "${SHA:-}" ] && echo yes || echo no )" >&2
            exit 1
          fi
          if ! echo "$SHA" | grep -Eq '^[0-9a-f]{6,40}$'; then
            echo "Invalid SHA format (expected hex): $SHA" >&2
            exit 1
          fi
          if ! echo "$IMAGE" | grep -Eq '^ghcr\.io/[a-z0-9._-]+/[a-z0-9._-]+$'; then
            echo "Invalid IMAGE format: $IMAGE" >&2
            exit 1
          fi
          ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "NPM_NET_NAME='${DOCKER_NETWORK}' CONTAINER_NAME='${CONTAINER_NAME}' IMAGE='${IMAGE}' SHA='${SHA}' bash -s" <<'EOF'
          set -euo pipefail

          if ! docker network inspect "$NPM_NET_NAME" >/dev/null 2>&1; then
            docker network create --driver bridge "$NPM_NET_NAME"
          fi

          # Cleanup any leftover candidate containers from previous runs.
          docker ps -aq --filter "name=${CONTAINER_NAME}-cand-" | xargs -r docker rm -f >/dev/null 2>&1 || true

          docker pull "${IMAGE}:${SHA}"

          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          docker run -d --name "$CONTAINER_NAME" \
            --network "$NPM_NET_NAME" \
            --network-alias "$CONTAINER_NAME" \
            --restart unless-stopped \
            --label commit_sha="$SHA" \
            "${IMAGE}:${SHA}"

          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME" 2>/dev/null || echo false)" != "true" ]; then
            echo "Final container is not running." >&2
            docker ps -a --filter "name=$CONTAINER_NAME" >&2 || true
            docker logs --tail=200 "$CONTAINER_NAME" >&2 || true
            exit 1
          fi

          # Health check (hybrid: port open -> http ok). Retry up to 30s.
          ok=false
          for i in $(seq 1 30); do
            if docker exec "$CONTAINER_NAME" sh -lc "command -v nc >/dev/null 2>&1"; then
              if docker exec "$CONTAINER_NAME" sh -lc "nc -z 127.0.0.1 80" >/dev/null 2>&1; then
                if docker exec "$CONTAINER_NAME" sh -lc "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"; then
                  ok=true
                  break
                fi
              fi
            else
              if docker exec "$CONTAINER_NAME" sh -lc "wget -qO- http://127.0.0.1/ >/dev/null 2>&1"; then
                ok=true
                break
              fi
            fi
            sleep 1
          done
          if [ "$ok" != "true" ]; then
            echo "Health check failed after timeout." >&2
            docker ps -a --filter "name=$CONTAINER_NAME" >&2 || true
            docker logs --tail=200 "$CONTAINER_NAME" >&2 || true
            exit 1
          fi

          docker image prune -f --filter "until=72h" >/dev/null 2>&1 || true
          EOF
