stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
    - when: never

.build_template:
  stage: build
  image: node:20-alpine
  cache:
    key: ${CI_PROJECT_NAME}
    paths:
      - node_modules/
  before_script:
    - npm ci
  artifacts:
    expire_in: 1 week
    paths:
      - dist/blipzo-admin/

build_stg:
  extends: .build_template
  environment:
    name: stg
  script:
    - npm run build -- --configuration development
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

build_prod:
  extends: .build_template
  environment:
    name: prod
  script:
    - npm run build -- --configuration production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

.deploy_template:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - |
        echo "SSH_HOST=$SSH_HOST"
        echo "SSH_PORT=$SSH_PORT"
        if [ -n "${SSH_USER:-}" ]; then
          echo "SSH_USER set? yes"
        else
          echo "SSH_USER set? no"
        fi
        echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"
        if [ -z "${SSH_PORT:-}" ] || ! echo "$SSH_PORT" | grep -Eq '^[0-9]+$'; then
          echo "Invalid SSH_PORT: $SSH_PORT" >&2
          exit 1
        fi
    - mkdir -p ~/.ssh
    - |
        (printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519) 2>/dev/null \
          || printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
    - export SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
  script:
    - |
        ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
          "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
        set -euo pipefail
        mkdir -p "$DEPLOY_PATH"
        EOF
    - |
        rsync -az --delete \
          -e "ssh $SSH_OPTS -p $SSH_PORT" \
          dist/blipzo-admin/ \
          "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
    - |
        ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
          "SERVE_DIR='$SERVE_DIR' SERVE_PORT='$SERVE_PORT' bash -s" <<'EOF'
        set -euo pipefail
        if command -v fuser >/dev/null 2>&1; then
          fuser -k "${SERVE_PORT}/tcp" || true
        fi
        nohup python3 -m http.server "$SERVE_PORT" --bind 127.0.0.1 --directory "$SERVE_DIR" \
          >/var/log/blipzo-admin-httpserver-${SERVE_PORT}.log 2>&1 &
        EOF

deploy_stg:
  extends: .deploy_template
  needs: ["build_stg"]
  environment:
    name: stg
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  variables:
    DEPLOY_PATH: /var/www/blipzo-admin-stg
    SERVE_DIR: /var/www/blipzo-admin-stg/browser
    SERVE_PORT: "4201"

deploy_prod:
  extends: .deploy_template
  needs: ["build_prod"]
  environment:
    name: prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    DEPLOY_PATH: /var/www/blipzo-admin-prod
    SERVE_DIR: /var/www/blipzo-admin-prod/browser
    SERVE_PORT: "4202"
