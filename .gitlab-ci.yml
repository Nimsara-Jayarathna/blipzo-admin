stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
    - when: never

build_stg:
  stage: build
  image: docker:25
  services:
    - name: docker:25-dind
      alias: docker
  environment:
    name: stg
  variables:
    DOCKER_TLS_CERTDIR: ""
    BUILD_CONFIGURATION: production
    ADMIN_API_BASE_URL: $ADMIN_API_BASE_URL_STG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg BUILD_CONFIGURATION --build-arg ADMIN_API_BASE_URL -t "$CI_REGISTRY_IMAGE:stg" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:stg"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

build_prod:
  stage: build
  image: docker:25
  services:
    - name: docker:25-dind
      alias: docker
  environment:
    name: prod
  variables:
    DOCKER_TLS_CERTDIR: ""
    BUILD_CONFIGURATION: production
    ADMIN_API_BASE_URL: $ADMIN_API_BASE_URL_PROD
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg BUILD_CONFIGURATION --build-arg ADMIN_API_BASE_URL -t "$CI_REGISTRY_IMAGE:prod" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:prod"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

.deploy_template:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - |
        echo "SSH_HOST=$SSH_HOST"
        echo "SSH_PORT=$SSH_PORT"
        if [ -n "${SSH_USER:-}" ]; then
          echo "SSH_USER set? yes"
        else
          echo "SSH_USER set? no"
        fi
        echo "SSH_PRIVATE_KEY length: ${#SSH_PRIVATE_KEY}"
        if [ -z "${SSH_PORT:-}" ] || ! echo "$SSH_PORT" | grep -Eq '^[0-9]+$'; then
          echo "Invalid SSH_PORT: $SSH_PORT" >&2
          exit 1
        fi
    - mkdir -p ~/.ssh
    - |
        (printf '%s' "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519) 2>/dev/null \
          || printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
    - export SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
  script:
    - |
        ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
          "NPM_NET_NAME='${NPM_NET_NAME:-npm_default}' bash -s" <<'EOF'
        set -euo pipefail
        if ! docker network inspect "$NPM_NET_NAME" >/dev/null 2>&1; then
          docker network create --driver bridge "$NPM_NET_NAME"
        fi
        EOF
    - |
        ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "docker rm -f '$CONTAINER_NAME' >/dev/null 2>&1 || true"
    - |
        ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY'"
    - |
        ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "docker pull '$IMAGE'"
    - |
        ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
          "NPM_NET_NAME='${NPM_NET_NAME:-npm_default}' CONTAINER_NAME='$CONTAINER_NAME' NETWORK_ALIAS='$NETWORK_ALIAS' IMAGE='$IMAGE' bash -s" <<'EOF'
        set -euo pipefail
        docker run -d --name "$CONTAINER_NAME" \
          --network "$NPM_NET_NAME" \
          --network-alias "$NETWORK_ALIAS" \
          --restart unless-stopped \
          "$IMAGE"
        EOF

deploy_stg:
  extends: .deploy_template
  needs: ["build_stg"]
  environment:
    name: stg
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:stg
    CONTAINER_NAME: blipzo-admin-stg
    NETWORK_ALIAS: blipzo-admin-stg

deploy_prod:
  extends: .deploy_template
  needs: ["build_prod"]
  environment:
    name: prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    IMAGE: $CI_REGISTRY_IMAGE:prod
    CONTAINER_NAME: blipzo-admin-prod
    NETWORK_ALIAS: blipzo-admin-prod
