<div class="flex min-h-screen bg-gradient-to-b from-[#081321] to-[#0a1b31] text-slate-100">
  <aside
    class="flex w-[276px] shrink-0 flex-col border-r border-[#243044] bg-[#161c24] max-lg:w-full max-lg:border-b max-lg:border-r-0"
  >
    <div class="flex items-center gap-3 px-5 py-7">
      <div class="grid h-9 w-9 place-items-center rounded-md bg-[#137fec] text-white">
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
          <path
            d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm0 3.2 5 1.9V11c0 3.7-2.4 7.5-5 8.6-2.6-1.1-5-4.9-5-8.6V7.1l5-1.9Zm0 2.3a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Z"
          />
        </svg>
      </div>
      <h2 class="m-0 text-[1.35rem] font-semibold tracking-tight text-[#aab5c2]">BLIPZO ADMIN</h2>
    </div>

    <nav class="flex flex-1 flex-col gap-1 px-4 pb-4">
      <a
        routerLink="/dashboard"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-[rgba(19,127,236,0.16)] text-white"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-[1.05rem] font-medium text-[#9caac0] no-underline transition hover:bg-[#1f2732] hover:text-white"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 text-[#5ea8ff]" aria-hidden="true">
          <path d="M3 3h8v8H3V3Zm10 0h8v5h-8V3ZM3 13h5v8H3v-8Zm7 0h11v8H10v-8Z" />
        </svg>
        Dashboard
      </a>
      <a
        routerLink="users"
        routerLinkActive="bg-[rgba(19,127,236,0.16)] text-white"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-[1.05rem] font-medium text-[#9caac0] no-underline transition hover:bg-[#1f2732] hover:text-white"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
          <path d="M16 11a4 4 0 1 0-3.999-4A4 4 0 0 0 16 11Zm-8 1a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-2.7 0-8 1.36-8 4v2h10v-2c0-1.52.83-2.8 2.2-3.81A9.76 9.76 0 0 0 8 14Zm8 0c-2.7 0-8 1.36-8 4v2h16v-2c0-2.64-5.3-4-8-4Z" />
        </svg>
        Users
      </a>
      <a
        routerLink="currencies"
        routerLinkActive="bg-[rgba(19,127,236,0.16)] text-white"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-[1.05rem] font-medium text-[#9caac0] no-underline transition hover:bg-[#1f2732] hover:text-white"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
          <path d="M3 6h18v12H3V6Zm2 2v8h14V8H5Zm3.5 6.5a2.5 2.5 0 0 1 0-5h7v2h-7a.5.5 0 0 0 0 1h5v2h-5Z" />
        </svg>
        Currencies
      </a>
      <a
        routerLink="categories"
        routerLinkActive="bg-[rgba(19,127,236,0.16)] text-white"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-[1.05rem] font-medium text-[#9caac0] no-underline transition hover:bg-[#1f2732] hover:text-white"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
          <path d="m3 13 8 8 8-8-8-8-8 8Zm8-5.2 5.2 5.2L11 18.2 5.8 13 11 7.8ZM20.5 3l-2.8 2.8 1.4 1.4L22 4.4 20.5 3Z" />
        </svg>
        Categories
      </a>
      <a
        routerLink="system"
        routerLinkActive="bg-[rgba(19,127,236,0.16)] text-white"
        class="flex items-center gap-3 rounded-xl px-4 py-3 text-[1.05rem] font-medium text-[#9caac0] no-underline transition hover:bg-[#1f2732] hover:text-white"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
          <path d="m19.14 12.94.86-1.5-1.86-3.22-1.74.4a5.97 5.97 0 0 0-1.03-.6L15 6h-6l-.37 2.02c-.36.16-.7.36-1.03.6l-1.74-.4L4 11.44l.86 1.5a5.94 5.94 0 0 0 0 1.12L4 15.56l1.86 3.22 1.74-.4c.33.24.67.44 1.03.6L9 21h6l.37-2.02c.36-.16.7-.36 1.03-.6l1.74.4L20 15.56l-.86-1.5c.06-.37.06-.75 0-1.12ZM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z" />
        </svg>
        System
      </a>
    </nav>

    <div class="border-t border-[#243044] p-4">
      <button
        class="flex w-full items-center justify-center gap-2 rounded-xl border border-[rgba(244,63,94,0.25)] bg-[rgba(190,24,93,0.12)] px-4 py-3 text-xl font-bold text-[#f43f5e] transition hover:bg-[rgba(190,24,93,0.2)] disabled:cursor-not-allowed disabled:opacity-60"
        type="button"
        [disabled]="isSigningOut"
        (click)="onLogout()"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5" aria-hidden="true">
          <path d="M10 17v-2h4V9h-4V7h7v10h-7Zm-4 2V5h7v2H8v10h5v2H6Zm10-4v-2h5v-2h-5V9l-4 3 4 3Z" />
        </svg>
        {{ isSigningOut ? 'Logging out...' : 'Logout' }}
      </button>
    </div>
  </aside>

  <main class="min-w-0 flex-1">
    <header
      class="sticky top-0 z-10 flex min-h-16 items-center justify-between gap-4 border-b border-[#243044] bg-[#0f1620] px-8"
    >
      <div class="flex items-center gap-4">
        <h1 class="m-0 text-[1.95rem] font-bold tracking-tight text-[#f8fbff]">System Dashboard</h1>
        <span
          class="rounded-md border border-[#3a4757] bg-[#1d2733] px-3 py-1 text-[0.66rem] font-bold uppercase tracking-[0.08em] text-[#a2b1c3]"
        >
          ADMIN ACCESS
        </span>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 rounded-xl border border-[#3a4757] bg-[#1c2531] px-3 py-1.5">
          <div class="grid h-7 w-7 place-items-center rounded-full bg-[#344254] text-[#dce5f0]">
            <svg viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4" aria-hidden="true">
              <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-3.3 0-6 1.34-6 3v1h12v-1c0-1.66-2.7-3-6-3Z" />
            </svg>
          </div>
          <span class="text-[1.2rem] font-medium text-[#e6eef8]">sys_admin_01</span>
        </div>

        <button type="button" aria-label="Notifications" class="text-[#9ba9bf] transition hover:text-[#5ea8ff]">
          <svg viewBox="0 0 24 24" fill="currentColor" class="h-6 w-6" aria-hidden="true">
            <path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 1 0-14 0v5l-2 2v1h18v-1l-2-2Z" />
          </svg>
        </button>
      </div>
    </header>

    <section class="mx-auto w-full max-w-[1450px] px-8 py-7">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
