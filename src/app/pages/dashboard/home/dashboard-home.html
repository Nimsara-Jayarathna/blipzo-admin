<section class="dashboard-home">
  @if (isLoading) {
    <div class="state-card">Loading dashboard data...</div>
  } @else if (errorMessage) {
    <div class="state-card state-error">
      <p>{{ errorMessage }}</p>
      <button type="button" (click)="onRetry()">Retry</button>
    </div>
  } @else if (snapshot) {
    <app-dashboard-kpi-cards [summary]="snapshot.summary"></app-dashboard-kpi-cards>

    <section class="dashboard-grid">
      <app-dashboard-currency-usage
        [usage]="snapshot.currencyUsage"
        [selectedPeriod]="selectedPeriod"
        [isLoading]="isLoading"
        (periodChange)="onPeriodChanged($event)"
      ></app-dashboard-currency-usage>

      <app-dashboard-recent-events [events]="snapshot.recentEvents"></app-dashboard-recent-events>
    </section>
  }
</section>
