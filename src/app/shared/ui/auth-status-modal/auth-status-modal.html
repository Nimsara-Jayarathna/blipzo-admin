@if (state() !== 'hidden') {
  <div
    class="fixed inset-0 z-30 grid place-items-center bg-[rgba(2,10,20,0.65)] p-5 backdrop-blur"
    role="status"
    aria-live="polite"
  >
    <div
      class="w-full max-w-[28rem] rounded-2xl border border-[#3f5168] bg-gradient-to-b from-[#243041] to-[#1a2330] p-8 text-center text-[#eaf1fa] shadow-[0_24px_50px_rgba(0,0,0,0.42)]"
    >
      @if (state() === 'loading') {
        <div
          class="mx-auto mb-4 grid h-[4.2rem] w-[4.2rem] place-items-center rounded-full border border-[rgba(154,177,203,0.35)] bg-[rgba(154,177,203,0.08)]"
        >
          <span
            class="h-6 w-6 animate-spin rounded-full border-2 border-[rgba(216,230,247,0.25)] border-t-[#d8e6f7]"
          ></span>
        </div>
        <h2 class="mb-2 mt-0 text-4xl">Signing In</h2>
        <p class="m-0 text-[#95a8be]">Please wait while we verify your credentials.</p>
      } @else {
        <div
          class="mx-auto mb-4 grid h-[4.2rem] w-[4.2rem] place-items-center rounded-full border border-[rgba(154,177,203,0.35)] bg-[#dbe2eb] text-3xl font-extrabold text-[#111a25]"
        >
          ✓
        </div>
        <h2 class="mb-2 mt-0 text-4xl">Login Successful</h2>
        <p class="m-0 text-[#95a8be]">Redirecting to dashboard...</p>
        <div class="mt-4 flex justify-center gap-1" aria-hidden="true">
          <span class="h-2 w-2 animate-pulse rounded-full bg-[#90a6be]"></span>
          <span
            class="h-2 w-2 animate-pulse rounded-full bg-[#90a6be] [animation-delay:200ms]"
          ></span>
          <span
            class="h-2 w-2 animate-pulse rounded-full bg-[#90a6be] [animation-delay:400ms]"
          ></span>
        </div>
        <div
          class="mt-4 border-t border-[rgba(143,162,183,0.2)] pt-4 text-[0.68rem] uppercase tracking-[0.14em] text-[#95a8be]"
        >
          Authenticated session initialized
        </div>
      }
    </div>
  </div>
}
