@if (state() !== 'idle') {
  <div
    [class]="feedbackClass()"
    [attr.role]="state() === 'error' ? 'alert' : 'status'"
    aria-live="polite"
  >
    <span
      class="inline-grid h-4 w-4 place-items-center text-[0.85rem] font-bold"
      aria-hidden="true"
    >
      @if (state() === 'loading') {
        <span
          class="h-[0.95rem] w-[0.95rem] animate-spin rounded-full border-2 border-[rgba(216,230,247,0.25)] border-t-[#d8e6f7]"
        ></span>
      } @else if (state() === 'success') {
        ✓
      } @else {
        !
      }
    </span>

    <span>
      @if (state() === 'loading') {
        {{ loadingMessage() }}
      } @else if (state() === 'success') {
        {{ successMessage() }}
      } @else {
        {{ message() }}
      }
    </span>
  </div>
}
