@if (isVisible()) {
  <div class="request-modal-overlay" [class.error-mode]="isError()">
    <section class="request-modal-card" role="status" aria-live="polite">
      @if (isLoading()) {
        <div class="spinner" aria-hidden="true"></div>
        <h2>Processing</h2>
      } @else {
        <div class="error-icon" aria-hidden="true">!</div>
        <h2>Request Failed</h2>
      }

      <p>{{ state().message }}</p>

      @if (isError()) {
        <button type="button" (click)="close()">Close</button>
      }
    </section>
  </div>
}
